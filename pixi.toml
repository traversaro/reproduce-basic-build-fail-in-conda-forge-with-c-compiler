[workspace]
name = "c-compiler-reproducer"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
cmake = "*"

[feature.gcc.dependencies]
c-compiler = "==2.0.0"

[feature.clang.dependencies]
clang_linux-64 = "21.1.*"

[environments]
default = ["gcc"]
clang = ["clang"]

[tasks]
test = "sh scripts/build.sh"
shared = "sh scripts/build.sh shared"
static = "sh scripts/build.sh static"
executable = "sh scripts/build.sh executable"
