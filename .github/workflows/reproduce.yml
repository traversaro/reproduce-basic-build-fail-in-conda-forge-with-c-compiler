name: Reproduce without system binutils

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [c-compiler, gcc, clang]
        target: [shared, static, executable]
    steps:
      - uses: actions/checkout@v4
      - name: Build minimal Docker image
        run: docker build --tag c-compiler-reproducer .
      - name: Build and test ${{ matrix.target }} (${{ matrix.environment }}) without system binutils
        run: docker run --rm c-compiler-reproducer --environment "${{ matrix.environment }}" "${{ matrix.target }}"
